<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — InterVarsity at NMU</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/logos/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Mulish:wght@400;600&family=Zilla+Slab:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
  <style>
    .nf { min-height: 80vh; display: grid; place-items: center; text-align: center; background: var(--grad-blue); color: #fff; }
    .nf .mark { width: 84px; margin: 0 auto 1.4rem; }
    .nf h1 { color: #fff; font-size: clamp(3rem, 10vw, 6rem); margin: 0; }
    .nf p { color: rgba(255,255,255,.92); max-width: 30rem; margin: .6rem auto 1.6rem; }
  </style>
</head>
<body>
  <section class="nf">
    <div class="wrap">
      <img class="mark" src="/assets/logos/mark-white.png" alt="InterVarsity" />
      <p class="eyebrow" style="color:var(--fiya-gold)">Page not found</p>
      <h1>404</h1>
      <p>Looks like this page wandered off campus. Let's get you back to somewhere familiar.</p>
      <a class="btn btn--white" href="/">Take me home</a>
    </div>
  </section>
</body>
</html>
