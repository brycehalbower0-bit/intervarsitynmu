<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER pictorial mark for InterVarsity at NMU.
  Inspired by the brand: a missional-blue arch (open ring) sheltering a
  revival-orange open book = "Scripture as our foundation, bringing light."

  Per the InterVarsity Brand Book (pp. 13, 22, 63) every chapter MUST use a
  logo created with the official chapter logo generator. Replace this file
  (and logo references in the markup) with your generated chapter logo before
  going live.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="InterVarsity mark">
  <defs>
    <linearGradient id="ivArch" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#006880"/>
      <stop offset="1" stop-color="#009BBF"/>
    </linearGradient>
    <linearGradient id="ivBook" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#DC4128"/>
      <stop offset="1" stop-color="#F99D1C"/>
    </linearGradient>
  </defs>
  <!-- open arch (ring open at the bottom) -->
  <path d="M 28.79 69.28 A 33 33 0 1 1 71.21 69.28"
        fill="none" stroke="url(#ivArch)" stroke-width="13" stroke-linecap="round"/>
  <!-- open book -->
  <path d="M 50 62.5 C 41 59.5 31 59.5 24.5 63 L 26.5 72.6 C 33 69.1 43 69.1 50 72.1 Z" fill="url(#ivBook)"/>
  <path d="M 50 62.5 C 59 59.5 69 59.5 75.5 63 L 73.5 72.6 C 67 69.1 57 69.1 50 72.1 Z" fill="url(#ivBook)"/>
  <!-- book spine -->
  <line x1="50" y1="61.4" x2="50" y2="72.1" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
</svg>
